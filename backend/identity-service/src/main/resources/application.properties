
spring.application.name=identity-service

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/fincore
spring.datasource.username=fincore
spring.datasource.password=local_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
# Email verification (configure SMTP in deployment environment)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@fincore.local}
# ONLY enable for local development; OTP is written to identity-service logs.
app.mail.dev-log-otp=${APP_MAIL_DEV_LOG_OTP:false}

# Account Service used to provision a customer account after email verification
app.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
