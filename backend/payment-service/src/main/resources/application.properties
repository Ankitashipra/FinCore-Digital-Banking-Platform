spring.application.name=payment-service
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=fincore
spring.datasource.password=local_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Account Service integration
app.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
app.internal-api-key=${INTERNAL_API_KEY}
app.jwt.secret=${JWT_SECRET}