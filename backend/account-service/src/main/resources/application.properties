
spring.application.name=account-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/accountdb
spring.datasource.username=fincore
spring.datasource.password=local_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8082

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


fincore.risk.large-transfer-threshold=50000
fincore.risk.velocity-limit=3

app.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
app.notification.internal-api-key=${INTERNAL_API_KEY}

# Account Service
app.account.base-url=http://localhost:8082

# Internal service configuration
app.internal-api-key=${INTERNAL_API_KEY}
app.jwt.secret=${JWT_SECRET}