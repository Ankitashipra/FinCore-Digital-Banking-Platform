services:
  postgres:
    image: postgres:16-alpine
    container_name: fincore-postgres
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fincore-postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fincore-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - fincore-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ../../backend/identity-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincore
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: local_dev_password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your PowerShell session}
      APP_MAIL_DEV_LOG_OTP: "true"
      ACCOUNT_SERVICE_URL: http://account-service:8082
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@fincore.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ../../backend/notification-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: local_dev_password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your PowerShell session}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your PowerShell session}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  account-service:
    build:
      context: ../../backend/account-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountdb
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: local_dev_password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your PowerShell session}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your PowerShell session}
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: ../../backend/payment-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: local_dev_password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your PowerShell session}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your PowerShell session}
      ACCOUNT_SERVICE_URL: http://account-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8086"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your PowerShell session}
      SPRING_DATA_REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      NOTIFICATION_WEBSOCKET_URL: ws://notification-service:8084
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      account-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

volumes:
  fincore-postgres-data:
    name: docker_fincore-postgres-data
  fincore-redis-data:
    name: docker_fincore-redis-data